<html>
<head>
    <title>Users</title>
    </head>
<body >
  
       <div class="form-container">
        <!-- <h3 class="text-center mb-4">Users List App</h3> -->
    </div>
      <div  ng-if="loadingComplete" class="d-flex justify-content-center align-items-center ">
    <div class="text-center">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
      <p class="mt-3">Loading, please wait...</p>
    </div>
  </div>
    <p class="text-center mt-4" style="color: white;" ng-if="students.length === 0 && !loadingComplete">
    No students added yet!
</p>
    <table class="table mt-4" ng-if="students.length > 0">
        <thead>
            <tr>
                <th>#</th>
                <th>StudentName</th>
                <th>Email</th>
                <th>Created at</th>
                <th>View</th>
                <th>Edit</th>
                <th>Delete</th>
            </tr>
        </thead>
        <tbody>
            <tr ng-repeat="student in students">
                <td>{{ $index + 1 }}</td>
                <td>{{ student.name }}</td>
                <td>{{ student.email }}</td>
                <td>{{ student.created_at | date:'short'}}</td>
                <td><a class="btn btn-success btn-sm" href="#!/userDetails/{{student.id}}">View</a></td>
                <td><button class="btn btn-secondary btn-sm" ng-click="edit($index)">Edit</button></td>
                <td><button class="btn btn-danger btn-sm" ng-click="delete($index)">Delete</button></td>
            </tr>
        </tbody>
</body>
</html>
