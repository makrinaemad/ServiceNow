<div class="container mt-5" style="max-width: 500px;">
  <div class="card shadow-sm p-4">
    <h3 class="text-center mb-4">Add New User</h3>

    <form name="submitform" novalidate>

      <div class="mb-3">
        <label class="form-label fw-bold">User Name</label>
        <input type="text"
               class="form-control"
               placeholder="Enter your name"
               ng-model="name"
               name="name"
               required>
        <div ng-show="submitform.name.$touched && submitform.name.$invalid" class="text-danger mt-1 small">
          User name is required.
        </div>
      </div>


      <div class="mb-3">
        <label class="form-label fw-bold">User Email</label>
        <input type="email"
               class="form-control"
               placeholder="Enter your email"
               ng-model="email"
               name="email"
               required>
        <div ng-show="submitform.email.$touched && submitform.email.$invalid" class="text-danger mt-1 small">
          User email is required.
        </div>
      </div>


      <button type="submit"
              class="btn btn-secondary w-100 fw-bold"
              ng-disabled="submitform.name.$invalid || submitform.email.$invalid"
              ng-click="submitForm()">
        Add User
      </button>

    </form>
  </div>
</div>
