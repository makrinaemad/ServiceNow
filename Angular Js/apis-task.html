<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student List</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
        <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.6.9/angular.min.js"></script>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: gray;
        }

        .form-container {
            max-width: 500px;
            margin: 60px auto;
            padding: 30px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .btn-custom {
            background-color: black;
            color: white;
        }

        .btn-custom:hover {
            background-color: gray;
        }
        .btn-custom:disabled {
    background-color: #6c757d;
    color: #e9ecef; 
    cursor: not-allowed;
    opacity: 0.7; 
}
    </style>
</head>
<body>

<div class="container" ng-app="myApp" ng-controller="myCtrl">
    <div class="form-container">
        <h3 class="text-center mb-4">Student List App</h3>
                <form name="submitform" novalidate>

            <div class="mb-3">
                <label class="form-label">Student Name</label>
                <input type="text"  class="form-control" placeholder="Enter your name" ng-model="name"  name="name" required>
            </div>
             <div ng-show="submitform.name.$touched && submitform.name.$invalid" class="text-danger mb-3">Student name is required.</div>
         <div class="mb-3">
                <label class="form-label">Student Email</label>
                <input type="email"  class="form-control" placeholder="Enter your email" ng-model="email" name="email" required>
            </div>

           
            <div ng-show="submitform.email.$touched && submitform.email.$invalid" class="text-danger mb-3">Student email is required.</div>

            
            <button ng-disabled=" submitform.name.$invalid || submitform.email.$invalid" type="submit" class="btn btn-custom w-100" ng-click="submitForm()">Add</button>

        </form>
    </div>
      <div  ng-if="loadingComplete" class="d-flex justify-content-center align-items-center ">
    <div class="text-center">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
      <p class="mt-3">Loading, please wait...</p>
    </div>
  </div>
    <p class="text-center mt-4" style="color: white;" ng-if="students.length === 0 && !loadingComplete">
    No students added yet!
</p>
    <table class="table mt-4" ng-if="students.length > 0">
        <thead>
            <tr>
                <th>#</th>
                <th>StudentName</th>
                <th>Email</th>
                <th>Created at</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <tr ng-repeat="student in students">
                <td>{{ $index + 1 }}</td>
                <td>{{ student.name }}</td>
                <td>{{ student.email }}</td>
                <td>{{ student.created_at | date:'short' }}</td>
                <td><button class="btn btn-danger btn-sm" ng-click="delete($index)">Delete</button></td>
            </tr>
        </tbody>
</div>
<script>

    var app = angular.module('myApp', []);
    app.controller('myCtrl', function($scope,StudentService) {   


        $scope.students = [];


         StudentService.getStudents().then(function(response) {
                $scope.students = response.data;
                console.log($scope.students);
        });

           $scope.loadingComplete = false;
           $scope.render=false;
                $scope.renderTable = function() {
                    $scope.loadingComplete = true;
                    StudentService.getStudents().then(function(response) {
                        $scope.students = response.data;
                    }).finally(function() {
                        $scope.loadingComplete = false; 
                    });
                };

             $scope.renderTable();

                $scope.submitForm = function() {
                    let newStudent = {
                        name: $scope.name,
                        email: $scope.email
                    };

                    StudentService.addStudent(newStudent).then(function(response) {
                        $scope.name = "";
                        $scope.email = "";
                        $scope.submitform.$setUntouched();
                        $scope.renderTable();
                    }).catch(function(error) {
                        console.error("Error adding student:", error);
                    });
                };


   });

   app.service('StudentService', function($http) {
    var apiLink = "https://jxciyjcjfmsovpkvjbhe.supabase.co/rest/v1/user";
    var apiKey = "sb_publishable_A0mawq7zZCEO8tcz0pfwfw_xaJiSNNT";
    var headers = {
        'apikey': apiKey,
        'Authorization': 'Bearer ' + apiKey
    };
    this.getStudents = function() {
        return $http.get(apiLink, { headers: headers });
    };

    this.addStudent = function(studentData) {
        return $http.post(apiLink, studentData, { headers: headers });
    };

});
    
</script>
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
