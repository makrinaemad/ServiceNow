<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student List</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
        <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.6.9/angular.min.js"></script>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: gray;
        }

        .form-container {
            max-width: 500px;
            margin: 60px auto;
            padding: 30px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .btn-custom {
            background-color: black;
            color: white;
        }

        .btn-custom:hover {
            background-color: gray;
        }
        .btn-custom:disabled {
    background-color: #6c757d;
    color: #e9ecef; 
    cursor: not-allowed;
    opacity: 0.7; 
}
    </style>
</head>
<body>

<div class="container" ng-app="myApp" ng-controller="myCtrl">
    <div class="form-container">
        <h3 class="text-center mb-4">Student List App</h3>

        <form name="submitform" novalidate>

            <div class="mb-3">
                <label class="form-label">Student Name</label>
                <input type="text" name="name" class="form-control" placeholder="Enter your name" ng-model="name" required>
            </div>
            <div ng-show="submitform.name.$touched && submitform.name.$invalid" class="text-danger mb-3">Student name is required.</div>

            <button ng-disabled=" submitform.name.$invalid" type="submit" class="btn btn-custom w-100" ng-click="submitForm()">Add</button>

        </form>
    </div>
    <p class="text-center mt-4" style="color: white;" ng-if="students.length === 0">
    No students added yet!
</p>
    <table class="table mt-4" ng-if="students.length > 0">
        <thead>
            <tr>
                <th>StudentName</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <tr ng-repeat="student in students">
                <td>{{ student.name }}</td>
                <td><button class="btn btn-danger btn-sm" ng-click="delete($index)">Delete</button></td>
            </tr>
        </tbody>
</div>
<script>

    var app = angular.module('myApp', []);
    app.controller('myCtrl', function($scope) {   
        $scope.students = [];
        $scope.submitForm = function() {

    $scope.students.push({
        name: $scope.name
    });

    $scope.name = "";
    $scope.submitform.$setUntouched();  
        };

        $scope.delete = function($index) {
           $scope.students.splice($index, 1);
            console.log($scope.students);
        };

    });
    
</script>
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
