<!DOCTYPE html>
<html lang="en" ng-app="myApp">
<head>
    <meta charset="UTF-8">
    <title>Student List</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- AngularJS -->
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.6.9/angular.min.js"></script>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light" ng-controller="myCtrl">

<div class="container mt-5">

    <h2 class="fw-bold mb-4">Student List</h2>


    <div class="row mb-3">
        <div class="col-md-4 mb-2">
            <input type="text"
                   class="form-control"
                   placeholder="Search by name..."
                   ng-model="searchText">
        </div>

        <div class="col-md-4 mb-2">
            <select class="form-select" ng-model="sortBy">
                <option value="name">Sort by Name</option>
                <option value="-marks">Sort by Marks (High to Low)</option>
                <option value="marks">Sort by Marks (Low to High)</option>
            </select>
        </div>
    </div>

    <!-- Table -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-bordered mb-0 text-center align-middle">
                <thead class="table-light">
                    <tr>
                        <th style="width:10%">#</th>
                        <th style="width:50%">Name</th>
                        <th style="width:40%">Marks</th>
                    </tr>
                </thead>
                <tbody>

                    <tr ng-repeat="student in filteredStudents = (students 
                                   | filter:{name:searchText} 
                                   | orderBy:sortBy)">
                        <td>{{$index + 1}}</td>

                        <td ng-class="{'text-success fw-bold': student.marks > 80}">
                            {{student.name}}
                        </td>

                        <td ng-class="{
                            'text-success fw-bold': student.marks > 80,
                            'text-danger fw-bold': student.marks < 40,
                        }">
                            {{student.marks}}
                        </td>
                    </tr>

                    <tr ng-if="filteredStudents.length === 0">
                        <td colspan="3" class="text-center text-danger fw-bold py-3">
                            No student found
                        </td>
                    </tr>

                </tbody>
            </table>
        </div>
    </div>

</div>

<script>
var app = angular.module("myApp", []);

app.controller("myCtrl", function($scope){

    $scope.students = [
        {name: "Alice", marks: 92},
        {name: "David", marks: 29},
        {name: "Emma", marks: 74},
        {name: "John", marks: 85},
        {name: "Robert", marks: 38}
    ];

    $scope.sortBy = "name"; 

});
</script>

</body>
</html>
