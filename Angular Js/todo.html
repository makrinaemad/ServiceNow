<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Todo List</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.6.9/angular.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: gray;
        }

        .form-container {
            max-width: 500px;
            margin: 60px auto;
            padding: 30px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .btn-custom {
            background-color: black;
            color: white;
        }

        .btn-custom:hover {
            background-color: gray;
        }

        .btn-custom:disabled {
            background-color: #6c757d;
            color: #e9ecef; 
            cursor: not-allowed;
            opacity: 0.7; 
        }

        .completed {
            text-decoration: line-through;
            color: gray;
        }
    </style>
</head>
<body>

<div class="container" ng-app="myApp" ng-controller="myCtrl">
    <div class="form-container">
        <h3 class="text-center mb-4">Todo List App</h3>

        <todo-list tasks="tasks" on-update="updateTasks(tasks)"></todo-list>
    </div>
</div>

<script>
var app = angular.module('myApp', []);


app.controller('myCtrl', function($scope) {
    $scope.tasks = [];

    $scope.updateTasks = function(updatedTasks) {
        console.log("Tasks updated:", updatedTasks);
    };
});


app.directive('todoList', function() {
    return {
        scope: {
            tasks: '=',
            onUpdate: '&'
        },
        template: `
        <form name="todoForm" novalidate ng-submit="addTask()">
            <div class="mb-3">
                <input type="text" class="form-control" placeholder="Enter task" ng-model="newTask" required>
            </div>
            <button type="submit" class="btn btn-custom w-100" ng-disabled="todoForm.$invalid">Add Task</button>
        </form>

        <p class="text-center mt-4" ng-if="tasks.length === 0" style="color: gray;">No tasks added yet!</p>

        <ul class="list-group mt-4" ng-if="tasks.length > 0">
            <li class="list-group-item d-flex justify-content-between align-items-center"
                ng-repeat="task in tasks track by $index">
                <div>
                    <input type="checkbox" ng-model="task.completed" ng-change="update()">
                    <span ng-class="{'completed': task.completed}">{{ task.name }}</span>
                </div>
                <button class="btn btn-danger btn-sm" ng-click="deleteTask($index)">Delete</button>
            </li>
        </ul>
        `,
        link: function(scope) {
            scope.addTask = function() {
                scope.tasks.push({ name: scope.newTask, completed: false });
                scope.newTask = '';
                scope.onUpdate({ tasks: scope.tasks });
            };

            scope.deleteTask = function(index) {
                scope.tasks.splice(index, 1);
                scope.onUpdate({ tasks: scope.tasks });
            };

            scope.update = function() {
                scope.onUpdate({ tasks: scope.tasks });
            };
        }
    };
});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
