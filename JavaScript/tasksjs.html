//task4
//student management system

let close=true;
let students=[];

while(close){ 

let student=
   {
 name:"",
 age:0, 
 grades:[]
   };

   let evaluation={
    average:0,
    classification:"",
    maxGrade:0,
    minGrade:0,
    totalGrades:0,
    status:""
   };

 student.name=prompt("Enter name", "");
 student.age=Number(prompt("Enter age", ""));

 do{
     let grade=prompt("Enter grade", "");
     if (grade==="stop" && student.grades.length<3){
            alert("Please enter at least 3 grades before stopping.");
            continue;}
     else if (grade==="stop"){
                break; } 
     
     else if (grade>100 || grade<0 || grade==""||!Number(grade)){
         alert("Invalid grade. Please enter a number between 0 and 100.");
         continue;
     }
     student.grades.push(grade); 
    
    }
     while (true);

evaluation.average=0;
for (let i=0; i<student.grades.length; i++){ 
    evaluation.average+=Number(student.grades[i]);
    }
 
  evaluation.average=evaluation.average/student.grades.length;

// average=student.grades.reduce((a,b)=>a+Number(b),0)/student.grades.length;

evaluation.maxGrade=Math.max(...student.grades); 
evaluation.minGrade=Math.min(...student.grades);

evaluation.status=evaluation.average>=60 ? "Passed" : "Failed";
evaluation.classification=evaluation.average>=90 ? "Excellent" : evaluation.average>=80 ? "Very Good" : evaluation.average>=70 ? "Good" : evaluation.average>=60 ? "Pass" : "Fail";
evaluation.totalGrades=student.grades.length;

let currentStudent={...student, ...evaluation}; 
students.push(currentStudent);

for (let i=0; i<students.length; i++)
{ let s=students[i];
     alert(`Student Name: ${s.name}\n
      Age: ${s.age}\n
      Grades: ${s.grades.join(", ")}\n
      Average Grade: ${s.average}\n
      Max Grade: ${s.maxGrade}\n
      Min Grade: ${s.minGrade}\n
      Status: ${s.status}\n
      Classification: ${s.classification}\n
      Total Grades: ${s.totalGrades}\n\n `)  ; }

alert(
    students.map(s => `Student Name: ${s.name}\nAverage Grade: ${s.average}\n`).join(""))

 while (true){
let answer=prompt("Do you want to enter another student? (yes/no)", "");

 if (answer.toLowerCase()==="no")
 {   alert("Goodbye!");
    close=false; 
    break; }

  else if (answer.toLowerCase()==="yes")
  { break; } 

  else
  { alert("Please answer with 'yes' or 'no'."); }
 }

}
