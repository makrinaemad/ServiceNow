<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FreshMart - Shop</title>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    .product-img {
      height: 300px;
      object-fit: cover;
    }
  </style>
</head>

<body class="d-flex flex-column min-vh-100">


  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-success fixed-top">
    <div class="container">

      <!-- Logo -->
      <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="home.html">
        <i class="fa-solid fa-cart-shopping fa-lg"></i>
        <span> <span class="text-white">Fresh</span><span class="text-warning">Mart</span></span>
      </a>

      <!-- Toggle -->
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Links -->
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="home.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="shop.html">Shop</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
          <li class="nav-item"><a class="nav-link" href="gallery.html">Gallery</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li>
        </ul>
      </div>

    </div>
  </nav>

  <!-- Title -->
  <section class="py-5" style="margin-top:70px;">
    <div class="container">
      <h1 class="text-center fw-bold mb-5">Fresh Fruits & Vegetables</h1>

      <!-- Products -->
      <div class="row g-4">

        <!-- Product 1 -->
        <div class="col-12 col-md-6 col-lg-3">
          <div class="card h-100 shadow-sm text-center">
            <img src="images/img5.jpg" class="card-img-top product-img" alt="Carrot">
            <div class="card-body">
              <h3 class="h5 fw-bold">Carrot</h3>
              <p class="text-muted">$1.25 / kg</p>
              <button class="btn btn-success rounded-pill w-75 fw-bold">
                Add to cart
              </button>
            </div>
          </div>
        </div>

        <!-- Product 2 -->
        <div class="col-12 col-md-6 col-lg-3">
          <div class="card h-100 shadow-sm text-center">
            <img src="images/img6.jpg" class="card-img-top product-img" alt="Bread">
            <div class="card-body">
              <h3 class="h5 fw-bold">Bread</h3>
              <p class="text-muted">$2.50 / loaf</p>
              <button class="btn btn-success rounded-pill w-75 fw-bold">
                Add to cart
              </button>
            </div>
          </div>
        </div>

        <!-- Product 3 -->
        <div class="col-12 col-md-6 col-lg-3">
          <div class="card h-100 shadow-sm text-center">
            <img src="images/img7.jpg" class="card-img-top product-img" alt="Apple">
            <div class="card-body">
              <h3 class="h5 fw-bold">Apple</h3>
              <p class="text-muted">$1.50 / kg</p>
              <button class="btn btn-success rounded-pill w-75 fw-bold">
                Add to cart
              </button>
            </div>
          </div>
        </div>

        <!-- Product 4 -->
        <div class="col-12 col-md-6 col-lg-3">
          <div class="card h-100 shadow-sm text-center">
            <img src="images/img8.jpg" class="card-img-top product-img" alt="Milk">
            <div class="card-body">
              <h3 class="h5 fw-bold">Milk</h3>
              <p class="text-muted">$2.50 / gallon</p>
              <button class="btn btn-success rounded-pill w-75 fw-bold">
                Add to cart
              </button>
            </div>
          </div>
        </div>

      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="bg-dark text-white text-center py-3 mt-auto">
    <p class="mb-0">2026 FreshMart Supermarket | 8-Page Project</p>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
