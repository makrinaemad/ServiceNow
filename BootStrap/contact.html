<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FreshMart - Contact</title>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="d-flex flex-column min-vh-100">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-success fixed-top">
    <div class="container">

      <!-- Logo -->
      <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="home.html">
        <i class="fa-solid fa-cart-shopping fa-lg"></i>
       <span> <span class="text-white">Fresh</span><span class="text-warning">Mart</span></span>
      </a>

      <!-- Toggle -->
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Links -->
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="home.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="shop.html">Shop</a></li>
          <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
          <li class="nav-item"><a class="nav-link" href="gallery.html">Gallery</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li>
        </ul>
      </div>

    </div>
  </nav>

  <!-- Page Content -->
  <main class="flex-grow-1">

    <section class="py-5" style="margin-top:70px;">
      <div class="container">

        <h1 class="text-center fw-bold mb-4">Get in Touch</h1>

        <div class="row justify-content-center">
          <div class="col-12 col-md-8 col-lg-6">

            <form class="bg-light p-4 rounded shadow-sm">

              <div class="mb-3">
                <label for="name" class="form-label fw-bold">Name:</label>
                <input type="text" id="name" name="name" class="form-control" placeholder="Your Name">
              </div>

              <div class="mb-3">
                <label for="email" class="form-label fw-bold">Email:</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="Your Email">
              </div>

              <div class="mb-3">
                <label for="message" class="form-label fw-bold">Message:</label>
                <textarea id="message" name="message" class="form-control" rows="5" placeholder="Write your message..."></textarea>
              </div>

              <button type="submit" class="btn btn-success w-100 fw-bold">
                Submit
              </button>

            </form>

          </div>
        </div>

      </div>
    </section>

  </main>

  <!-- Footer (always bottom) -->
  <footer class="bg-dark text-white text-center py-3 mt-auto">
    <p class="mb-0">2026 FreshMart Supermarket | 8-Page Project</p>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
